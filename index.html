<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Breach</title>
<style>
  body {
    margin: 0;
    background: black;
    color: #00ff00;
    font-family: monospace;
    overflow: hidden;
  }
  #terminal {
    padding: 30px;
    font-size: 1.2rem;
    white-space: pre-line;
  }
  #target {
    display: none;
    position: absolute;
    top: 15%;
    right: 8%;
    max-width: 280px;
    border: 2px solid red;
    filter: grayscale(100%);
  }
  .blink {
    animation: blink 1s step-start infinite;
  }
  @keyframes blink {
    50% { opacity: 0; }
  }
  #final {
    display: none;
    position: absolute;
    top: 70%;
    width: 100%;
    text-align: center;
    font-size: 2rem;
    color: red;
  }
</style>
</head>
<body>
<div id="terminal"></div>
<img id="target" src="target.jpg">
<div id="final">😂 Relax — you got pranked.</div>

<script>
const lines = [
  'Connecting to remote host...',
  'Identity trace started...',
  'TARGET IDENTIFIED',
  'Extracting employee records...',
  'Camera access enabled...',
  'Network override complete...',
  'Uploading confidential files...'
];

const terminal = document.getElementById('terminal');
let i = 0;

function typeLine() {
  if (i < lines.length) {
    terminal.innerHTML += lines[i] + '\n';

    if (i === 2) {
      document.getElementById('target').style.display = 'block';
    }

    i++;
    setTimeout(typeLine, 900);
  } else {
    terminal.innerHTML += '\n⚠ DEVICE COMPROMISED ⚠\n';
    terminal.innerHTML += '<span class="blink">Finalizing breach...</span>';

    setTimeout(() => {
      document.getElementById('final').style.display = 'block';
    }, 2500);
  }
}

typeLine();
</script>
</body>
</html>
